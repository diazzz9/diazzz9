<style>.tag{font:700 12px 'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:#22d3ee;letter-spacing:1.6px}.t{font:800 26px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf3;letter-spacing:-.4px}.d{font:400 15.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#8b949e}.ch{font:600 12.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf3}.m{font:500 12px 'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:#8b949e}
