<text x="32" y="44" class="tag">DISTRIBUTED SYSTEMS</text>
<text x="32" y="84" class="t">gRPC Library System</text>
<text x="32" y="120" class="d">Distributed loan management: a Java gRPC server with</text><text x="32" y="144" class="d">SQLite persistence and a Swing desktop client talking</text><text x="32" y="168" class="d">through remote procedure calls.</text><g transform="translate(32 194)"><rect width="56" height="26" rx="13" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.35"/><text x="28.0" y="17.5" text-anchor="middle" class="ch">Java</text></g><g transform="translate(96 194)"><rect width="56" height="26" rx="13" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.35"/><text x="28.0" y="17.5" text-anchor="middle" class="ch">gRPC</text></g><g transform="translate(160 194)"><rect width="86" height="26" rx="13" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.35"/><text x="43.0" y="17.5" text-anchor="middle" class="ch">Protobuf</text></g><g transform="translate(254 194)"><rect width="71" height="26" rx="13" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.35"/><text x="35.5" y="17.5" text-anchor="middle" class="ch">SQLite</text></g><g transform="translate(333 194)"><rect width="64" height="26" rx="13" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.35"/><text x="32.0" y="17.5" text-anchor="middle" class="ch">Swing</text></g>
<g transform="translate(538 26)" fill="none" stroke="#8b949e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18L18 6M8 6h10v10"/></g>
