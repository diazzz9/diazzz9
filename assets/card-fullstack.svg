<svg xmlns="http://www.w3.org/2000/svg" width="590" height="250" viewBox="0 0 590 250" role="img" aria-label="University Catalog API + UI">
<defs><linearGradient id="a" x1="0" x2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></linearGradient>
<radialGradient id="gl" cx="1" cy="0" r="0.9"><stop offset="0" stop-color="#34d399" stop-opacity="0.16"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient>
<clipPath id="c"><rect width="590" height="250" rx="14"/></clipPath></defs>
<style>.tag{font:700 12px 'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:#34d399;letter-spacing:1.6px}.t{font:800 26px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf3;letter-spacing:-.4px}.d{font:400 15.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#8b949e}.ch{font:600 12.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf3}.m{font:500 12px 'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:#8b949e}
.sh{animation:sh 6s ease-in-out infinite}@keyframes sh{0%,100%{opacity:.55}50%{opacity:1}}</style>
<g clip-path="url(#c)">
<rect width="590" height="250" fill="#0f1623"/><rect width="590" height="250" fill="url(#gl)" class="sh"/>
<rect width="590" height="3" fill="url(#a)"/>
<text x="32" y="44" class="tag">FULL-STACK</text>
<text x="32" y="84" class="t">University Catalog API + UI</text>
<text x="32" y="120" class="d">Full CRUD REST API for faculties and academic programs</text><text x="32" y="144" class="d">built with Spring Boot and JPA, consumed by an Angular</text><text x="32" y="168" class="d">21 SSR frontend.</text><g transform="translate(32 194)"><rect width="109" height="26" rx="13" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.35"/><text x="54.5" y="17.5" text-anchor="middle" class="ch">Spring Boot</text></g><g transform="translate(149 194)"><rect width="48" height="26" rx="13" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.35"/><text x="24.0" y="17.5" text-anchor="middle" class="ch">JPA</text></g><g transform="translate(205 194)"><rect width="41" height="26" rx="13" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.35"/><text x="20.5" y="17.5" text-anchor="middle" class="ch">H2</text></g><g transform="translate(254 194)"><rect width="79" height="26" rx="13" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.35"/><text x="39.5" y="17.5" text-anchor="middle" class="ch">Angular</text></g><g transform="translate(341 194)"><rect width="102" height="26" rx="13" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.35"/><text x="51.0" y="17.5" text-anchor="middle" class="ch">TypeScript</text></g>
<g transform="translate(538 26)" fill="none" stroke="#8b949e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18L18 6M8 6h10v10"/></g>
<text x="526" y="44" text-anchor="end" class="m">Back + Front</text>
</g>
<rect x=".5" y=".5" width="589" height="249" rx="14" fill="none" stroke="#21262d"/>
</svg>